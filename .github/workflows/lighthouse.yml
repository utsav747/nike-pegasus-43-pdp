name: Slow 4G mobile check

on:
  push:
  pull_request:
  workflow_dispatch: # the "Run workflow" button in the Actions tab
  repository_dispatch: # Vercel sends this after a deploy finishes
    types: [vercel.deployment.success]

jobs:
  lighthouse:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Lighthouse CI with the profile's throttling; fails on the speed-budget.json limits.
      - run: npm run perf:lhci
      # DevTools-throttled trace that fails if [data-testid="size-grid"] moves at all.
      - run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100 >/dev/null && break; sleep 1; done
          npm run perf:grid

  # Checks the live page on the same Slow 4G profile. Runs when Vercel reports a successful
  # deploy, or by hand from the Actions tab (Run workflow).
  live:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
      PERF_URL: https://nike-pegasus-43-pdp.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run perf:lhci
      - run: npm run perf:grid
